<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EventHub{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; }
    nav { padding-bottom: 12px; border-bottom: 1px solid #ccc; margin-bottom: 16px; }
    nav a { margin-right: 16px; }
    article { margin-bottom: 20px; }
    img { max-width: 100%; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'events:event_list' %}">Все события</a>
    <a href="{% url 'events:event_create' %}">Создать событие</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
